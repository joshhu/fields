# 分場稿：每個 scene 有旁白 (text) 與視覺清單 (visuals)。
# visual 類型：
#   anim:<name>    -> assets/anim/<name>.mp4  (Manim / numpy 動畫)
#   img:<key>      -> assets/img/<key>.*      (Wikimedia Commons 等，附 caption 字卡)
#   vid:<key>      -> assets/vid/<key>.mp4    (NASA / Commons 公有領域影片)
# weight 為該視覺在場景中所佔時間比例（預設 1）。
# 標題字卡 (title) 會在章節開頭顯示。

scenes:
  - id: s00_intro
    title: "場比粒子更基本"
    subtitle: "物理學三百年的終極轉向"
    visuals:
      - anim:title
      - vid:galaxy
      - anim:quantum_field
    text: >-
      不知道你有沒有過這種感覺：翻開今天任何一本現代物理教科書，從粒子物理到廣義相對論，
      從凝態物理甚至到金融數學，「場」這個字幾乎無所不在。
      量子場論是標準模型的底層語言，廣義相對論講的是時空的度規場，
      就連超導、拓樸序這些凝態問題，也得用量子場論的工具才說得清楚。
      可是往前倒推三百年，牛頓建立古典力學的時候，根本沒有「場」這回事。
      那時候大家眼中的世界很簡單：宇宙就是一堆硬梆梆的粒子在時空中跑來跑去，
      力就是粒子之間隔空的相互作用。
      這三百年裡，物理學到底經歷了什麼？為什麼放著直覺的「粒子」不用，
      偏要一頭栽進抽象的「場論」，甚至把場當成比粒子更基本的東西？
      一切，要從牛頓那個既好用又彆扭的萬有引力說起。

  - id: s01_newton
    title: "第一章　超距作用的彆扭"
    visuals:
      - img:newton
      - vid:earth_orbit
      - anim:action_at_distance
      - img:principia
    text: >-
      萬有引力定律有多好用，不必多說。從蘋果落地到行星公轉，從潮汐漲落到彗星回歸，
      天上地下的現象，一套公式就算得明明白白。
      但這個封神的理論有一個問題，連牛頓自己都覺得渾身不對勁，甚至打從心底覺得荒謬。
      那就是超距作用。
      依照萬有引力定律，兩個物體就算隔著浩瀚的真空，中間什麼都沒有，也能瞬間產生引力。
      太陽這邊一動，地球立刻就能感受到，不需要介質，也不需要時間。
      這就好比你坐在家裡，手都不用伸，十公尺外的杯子就自己飛過來。
      放在現實裡，你一定覺得這是魔術；但在牛頓力學裡，重力就是這樣運作的。
      牛頓在一六九三年寫給本特利的信裡說得很直白：
      一個物體不需要任何媒介，就能穿過真空作用在遠處的物體上，這在我看來是極大的荒謬。
      同時代的萊布尼茲也抓著這一點猛批，說這違反了「自然界不做跳躍」的原則。
      問題是，牛頓拿不出更好的替代方案，而萬有引力預測天體運動又準得離譜。
      於是大家抱著「好用就好」的心態，把「力到底怎麼傳遞」這個問題，硬生生拖了一百多年。
      現在回頭看，這個懸而未決的問題，正是場論的起點。

  - id: s02_faraday
    title: "第二章　法拉第的力線"
    visuals:
      - img:faraday
      - img:iron_filings
      - anim:field_lines
      - img:faraday_lab
    text: >-
      第一個把「空間本身」當一回事的人，是法拉第。
      他沒受過正規的數學教育，完全靠實驗直覺打天下。別人做實驗看現象，他卻能看穿現象背後的物理圖像。
      一八三零年代，法拉第注意到一個大家都見過、卻沒人在意的現象：
      把鐵屑撒在磁鐵周圍，輕敲紙面，鐵屑就會排成一條條規則的弧線，從一極連到另一極。
      法拉第盯著這些線條看了很久，提出一個離經叛道的想法：
      這些線不只是鐵屑排出來的圖案，而是真實存在於空間中的「力線」。
      空間不是空的，電荷和磁極不是直接隔空發力，而是先改變自己周圍的力線，
      力線的變化再傳遞出去，最後才作用到另一個電荷上。
      當時的主流是安培的超距作用框架，法拉第既沒有數學推導，又是學徒出身，
      很多人覺得他懂實驗、不懂理論。
      但法拉第不在乎，他甚至猜測萬有引力也可能透過類似的機制傳遞。
      方向是對的，只是他缺少一樣關鍵的東西：數學。

  - id: s03_maxwell
    title: "第三章　馬克士威與電磁場"
    visuals:
      - img:maxwell
      - anim:maxwell_eq
      - anim:em_wave
      - img:hertz
    text: >-
      把法拉第的直覺變成嚴謹理論的人，是馬克士威。
      他把法拉第腦中模糊的力線圖像，翻譯成精確的微分方程式。
      一八六五年，馬克士威發表〈電磁場的動力學理論〉；到了一八八零年代，
      黑維塞用向量分析把它整理成今天課本裡熟悉的四條方程式，也就是馬克士威方程組。
      這組方程一口氣統一了電、磁、光三種看似毫不相干的現象。
      更重要的是，它揭示電磁擾動不是瞬間傳遞，而是以有限的速度傳播，這個速度正好就是光速。
      電荷A動一下，不會立刻影響遠處的電荷B。它先擾動身邊的電磁場，
      擾動像水波一樣以光速一圈圈往外擴散，傳到B那裡，B才感受到力。
      在馬克士威的理論裡，場不再是粒子的附屬品，它有自己的能量、動量和角動量。
      就算空間裡一個電荷都沒有，電磁波也能在真空中自己傳播、自己攜帶能量。
      場，也是一種物質。
      一八八七年，赫茲用實驗證實了電磁波的存在，測到的傳播速度和光速完全一致。

  - id: s04_ether
    title: "第四章　以太的消失"
    visuals:
      - anim:michelson
      - img:michelson
      - img:einstein_1905
      - vid:sun
    text: >-
      不過還有個遺留問題：電磁波是在什麼介質裡傳播的？
      水波靠水，聲波靠空氣，當時的物理學家理所當然地認為，光也得靠一種介質，他們稱它為「以太」。
      為了測出地球相對於以太的運動，邁克生和莫立做了那個著名的實驗。
      結果不管怎麼測，光速在各個方向上都一樣，完全找不到以太存在的證據。
      整個物理學界都愣住了，很多人覺得一定是實驗做錯了。
      直到一九零五年，愛因斯坦站出來說：別找了，根本沒有以太。
      電磁波不需要介質，場本身就是物質存在的一種形式。
      狹義相對論確立了場的自主性。從此，場不再是描述粒子相互作用的輔助工具，
      它和粒子一樣，是宇宙的基本組成。

  - id: s05_gr
    title: "第五章　時空本身就是場"
    visuals:
      - img:einstein
      - anim:spacetime
      - vid:black_hole
      - img:eclipse_1919
    text: >-
      如果說馬克士威讓電磁場成為獨立的物理實在，那麼愛因斯坦做得更徹底：他把時空本身也變成了場。
      在牛頓的世界觀裡，時空是一座固定不變的舞台，所有物理事件都在台上發生，舞台本身和演員無關。
      廣義相對論卻告訴我們：時空不是舞台，它本身就是演員。
      物質的能量和動量會彎曲時空，彎曲的時空又會告訴物質該怎麼運動。
      我們感受到的引力，本質上就是時空彎曲的幾何效應。
      就像在彈簧床上放一顆鉛球，床面凹了下去；再放一顆小球，它就沿著凹陷滾向鉛球。
      看起來像是鉛球在吸引小球，其實是床面的形狀改變了。
      描述時空曲率如何演化的，就是愛因斯坦場方程式。你看，名字就叫「場方程式」，
      它和馬克士威方程組其實是同一種範式：一個場，在時空中依照某種動力學規律演化。
      一九一五年之後，愛因斯坦花了人生最後四十年尋找「統一場論」，想把電磁場和重力場放進同一個框架。
      他最後失敗了，因為那時弱作用力和強作用力都還沒研究清楚。
      但這件事本身就說明了：在愛因斯坦眼中，場才是物理學最底層的語言。

  - id: s06_rqm
    title: "第六章　量子力學的困境"
    visuals:
      - img:schrodinger
      - anim:negative_energy
      - img:dirac
      - img:positron
    text: >-
      你可能會問：量子力學一開始明明是圍繞著「粒子」展開的，為什麼最後也走進了場論？
      這裡有個冷知識。很多人以為克萊因－戈登方程式是薛丁格方程式的相對論推廣，真實的歷史正好相反。
      一九二五年底，薛丁格最先推導出的，其實是一條相對論性的波動方程式，
      但它預言的氫原子光譜精細結構和實驗對不上。薛丁格以為自己錯了，
      轉而在一九二六年發表了非相對論版本，也就是今天的薛丁格方程式。
      相對論性的量子方程為什麼這麼難搞？因為它會出現負的機率密度，這在物理上完全說不通。
      一九二八年，狄拉克提出了狄拉克方程式，自然包含電子自旋，還能精確算出氫原子光譜，
      卻又冒出了負能量解：電子的能量可以無限低，照理說所有電子都會往下掉，世界就崩了。
      狄拉克提出「電洞理論」：真空裡早已填滿負能態的電子，形成「狄拉克海」，
      海裡少掉一個電子，那個洞就像一個帶正電的粒子。
      很多人覺得這是數學把戲，直到一九三二年，安德森真的在宇宙射線裡發現了正電子。

  - id: s07_qft_birth
    title: "第七章　場的量子化"
    card: center
    visuals:
      - anim:pair_creation
      - img:heisenberg
      - anim:harmonic_modes
      - img:solvay_1927
    text: >-
      反粒子的發現帶來一個更深刻的問題：粒子可以產生，也可以湮滅。
      電子和正電子相遇會變成光子，光子也能變成電子對。粒子數不守恆，種類也會改變。
      用單一粒子的波函數，怎麼描述粒子憑空出現又憑空消失？描述不了。
      單粒子的相對論量子力學，從根本上就不自洽。
      問題逼到這個地步，量子場論就自然誕生了。
      其實早在一九二六年，海森堡、玻恩和約爾當就把電磁場的每一個振動模式，當成一個量子諧振子。
      模式的能量升高一份，就等於產生一個光子。這就是量子場論真正的起點。
      一九二七年，狄拉克提出第一個描述帶電物質與電磁場相互作用的理論，也就是量子電動力學，簡稱QED。

  - id: s08_field_ocean
    title: "第八章　粒子是場的漣漪"
    visuals:
      - anim:field_ocean
      - anim:quantum_field
      - img:fermi
      - anim:beta_decay
    text: >-
      在這個框架裡，圖像徹底反過來了。古典物理中，粒子是基本的，場只是粒子之間的媒介；
      在量子場論裡，場才是最基本的實體。
      每一種粒子都對應一個瀰漫整個時空的場：電子對應電子場，光子對應電磁場，夸克對應夸克場。
      我們看到的粒子，其實是場的局部激發。
      打個比方：場就像一片平靜的海，粒子是海面上濺起的浪花。
      浪花有高有低，可以出現也可以消失，但不管浪花怎麼變，大海始終都在。
      這個圖像完美解決了粒子數不守恆的問題。
      在貝他衰變中，中子變成質子、電子和反微中子，並不是一個粒子拆成了三個，
      而是中子場退激發，質子場、電子場、微中子場同時被激發起來。
      一九三四年，費米用量子場論描述貝他衰變大獲成功。大家終於意識到：要描述相對論性的微觀世界，場論是繞不開的。

  - id: s09_renorm
    title: "第九章　無窮大與重整化"
    visuals:
      - anim:infinity
      - img:feynman
      - anim:feynman_diagram
      - img:tomonaga
      - img:schwinger
    text: >-
      但量子場論的發展並不順利。一九三零到四零年代，物理學家遇到一個差點毀掉整個理論的問題：無窮大。
      電子和自己的電磁場相互作用的能量，也就是電子自能，算出來是無窮大；
      真空極化的貢獻，也是無窮大。幾乎所有高階修正，結果都發散。
      一個算出來全是無窮大的理論，還有什麼用？很多人懷疑量子場論從根本上就錯了。
      直到一九四七到四九年間，貝特、施溫格、費曼和朝永振一郎先後找到出路：重整化。
      核心想法是：理論裡的「裸質量」和「裸電荷」本身是無窮大的，但實驗永遠測不到裸的量。
      我們測到的質量和電荷，已經包含了這些修正，是有限的。
      只要把無窮大重新吸收進這些參數，剩下的計算就都是有限的。
      聽起來像數學把戲，但重整化之後的結果和實驗吻合得驚人。
      費曼也在這個過程中發明了費曼圖，每一張圖對應微擾展開裡的一項。
      要注意，費曼圖並不是粒子的運動軌跡，它的底層，仍然是場的量子理論。
      量子電動力學因此成為人類史上最精確的理論之一：電子異常磁矩的理論值和實驗值，吻合到大約一兆分之一的精度。

  - id: s10_wilson
    title: "第十章　威爾森與有效場論"
    visuals:
      - img:wilson
      - anim:block_spin
      - anim:rg_flow
      - anim:nested_theories
    text: >-
      但重整化為什麼有效？很長一段時間沒人說得清楚，直到一九七零年代，肯尼斯．威爾森用重整化群把它講透了。
      威爾森指出，一個量子場論在不同能量尺度下的行為並不一樣，高能量尺度的細節，到了低能量就會被「抹平」。
      重整化本質上是一種「粗粒化」：就像遠遠看一張照片，細節模糊了，整體輪廓卻很清楚。
      低能物理就是遠看的照片，微觀細節被洗掉，只剩下普適的行為。
      這也解釋了凝態物理的臨界現象：流體、磁鐵、合金這些完全不同的系統，
      在相變點附近卻由相同的臨界指數描述，因為它們的低能行為只和對稱性、空間維度有關。
      這帶來一個哲學上的重大轉變：有效場論典範。
      我們用的每一個場論，都只是某個更深層理論在低能量下的有效近似，有自己的適用範圍。
      標準模型在加速器能達到的能量上準得離譜，但到了普朗克尺度，一定會被更基本的理論取代。
      就像牛頓力學是相對論在低速下的近似。威爾森因此獲得一九八二年諾貝爾物理獎，
      他讓場論從「計算工具」上升到了「世界觀」的層次。

  - id: s11_yang_mills
    title: "第十一章　楊－米爾斯與包立之問"
    visuals:
      - img:yang
      - anim:gauge_symmetry
      - img:pauli
      - img:oppenheimer
    text: >-
      QED成功之後，物理學家自然想用同樣的方法描述強作用力和弱作用力。
      但這兩種力都是短程力，照理說傳遞它們的粒子應該很重，而當時的規範場粒子天生質量為零。
      一九五四年，三十二歲的楊振寧和米爾斯做了一個大膽的推廣：
      把QED裡最簡單、滿足交換律的U(1)規範對稱性，推廣到不滿足交換律的非阿貝爾群。這就是楊－米爾斯理論。
      據說楊振寧在普林斯頓報告時，包立就坐在台下，一講完就追問：你的規範粒子，質量是多少？
      楊振寧說：零。包立立刻反問：短程力需要有質量的粒子，你怎麼解釋？
      場面一度非常尷尬，最後由主持人歐本海默出面打圓場。
      包立確實問到了要害，楊－米爾斯理論因此沉寂了十幾年。
      但楊振寧的直覺是對的，問題不在理論本身，而在我們對真空的理解。

  - id: s12_higgs
    title: "第十二章　對稱性破缺與標準模型"
    visuals:
      - anim:pencil
      - anim:mexican_hat
      - img:higgs
      - vid:lhc
      - anim:standard_model
    text: >-
      一九六零年代初，南部陽一郎從超導的BCS理論中，提煉出「自發對稱性破缺」的概念：
      理論本身有對稱性，但真空態並不滿足這個對稱性。
      就像一支鉛筆立在桌上，各個方向都對稱，可是它一倒下，就指向某個特定方向，對稱性就破缺了。
      接著希格斯等人提出希格斯機制：規範玻色子原本沒有質量，但真空發生自發對稱性破缺後，
      它們可以「吃掉」戈德斯通玻色子而獲得質量。楊－米爾斯理論的死穴，一下子就解開了。
      一九六七年，溫伯格用SU(2)乘U(1)規範群加上希格斯機制，建立電弱統一理論；
      一九七三年，格羅斯、波利策和威爾切克以SU(3)規範群建立量子色動力學，描述夸克之間的強作用力。
      粒子物理的標準模型就此成形，核心是SU(3)乘SU(2)乘U(1)的規範群。
      二零一二年，歐洲核子研究組織的大型強子對撞機發現了希格斯玻色子，替這座大廈補上最後一塊磚。

  - id: s13_symmetry
    title: "第十三章　對稱性決定一切"
    visuals:
      - img:noether
      - anim:symmetry_logic
      - img:lhc_detector
    text: >-
      到這裡，做物理的方式已經根本反轉。
      牛頓的時代，是先觀察到一種力，再想辦法用方程式描述它。
      在規範場論裡，邏輯反過來：你先指定一個對稱性，對稱性決定拉格朗日量的形式，進而決定所有相互作用的規律。
      從諾特定理告訴我們「對稱性對應守恆律」，到規範場論告訴我們「對稱性決定相互作用」，
      場論把對稱性的力量發揮到了極致。
      難怪有人說，二十世紀物理學的三大里程碑，是相對論、量子力學和規範場論。

  - id: s14_curved
    title: "第十四章　黑洞邊的粒子"
    visuals:
      - img:hawking
      - anim:hawking_radiation
      - img:m87
      - anim:unruh
    text: >-
      還有一個交叉點，進一步證明場比粒子更基本，那就是彎曲時空中的量子場論。
      一九七零年代，物理學家研究把量子場放進彎曲時空會發生什麼，得到兩個驚人的預言：盎魯效應和霍金輻射。
      盎魯效應說：一個加速運動的觀察者，在真空中會看到大量粒子，就像身處熱浴之中；
      而慣性觀察者看到的，仍然是一片真空。
      霍金輻射更有名：黑洞並不是全黑的，它會緩慢地向外輻射粒子，最後蒸發殆盡。
      這兩個效應背後有一個共同的深刻意義：粒子的定義，取決於觀察者。
      自由下落的觀察者覺得是真空，停在黑洞外的觀察者卻覺得充滿輻射。
      但場不一樣。不管你在哪個參考系，場的存在都是客觀的，
      只是不同的觀察者，把場的不同部分解讀成了「粒子」。
      粒子是場在特定觀測下的顯現，場才是宇宙的底層實體。

  - id: s15_four_reasons
    title: "第十五章　為什麼是場？"
    card: none
    visuals:
      - anim:four_reasons
    text: >-
      現在，我們終於可以回答一開始的問題：物理學為什麼走向場論？
      因為粒子的圖像，在四個層面同時碰壁。
      第一，超距作用說不通。只有場論，才能給出逐點傳遞、以有限速度傳播的相互作用。
      第二，相對論性量子力學不自洽。單粒子理論處理不了粒子的產生與湮滅，只有場論能自然描述。
      第三，多種相互作用無法統一。從電磁力到弱力、強力，只有規範場論能透過對稱性統一描述，而且精度驚人。
      第四，局域對稱性無法實現。要讓對稱性在每一點都成立，就必須引入規範場，這是粒子圖像做不到的。
      場論是唯一一個在所有層面都能給出自洽解答的框架。不是物理學家偏愛抽象，而是一步步被逼到這裡的。

  - id: s16_beyond
    title: "第十六章　場論之後"
    visuals:
      - img:cmb
      - anim:string_modes
      - vid:galaxy
      - anim:lattice
    text: >-
      當然，場論也不是終點。
      標準模型再精確，也解釋不了暗物質和暗能量，而它們佔了宇宙總能量的百分之九十五。
      廣義相對論再優美，在奇點處也會失效，量子重力至今沒有令人滿意的答案。
      物理學家正在尋找超越場論的框架。
      弦論認為，最基本的既不是點粒子，也不是場，而是一維的弦；粒子和場，都是弦不同振動模式的近似。
      拓樸量子場論幾乎不在乎時空的幾何形狀，只關心拓樸不變量，它預言的任意子已在分數量子霍爾效應中得到證實。
      晶格規範理論則把連續時空切成晶格，讓非微擾計算成為可能，晶格QCD已是計算強子質量、理解夸克侷限的重要工具。

  - id: s17_outro
    title: "尾聲　層層嵌套"
    visuals:
      - anim:nested_theories
      - vid:earth
      - anim:outro
    text: >-
      不管未來的理論長什麼樣子，有一點幾乎可以肯定：它不會徹底推翻場論，
      而是把場論當作自己的低能量極限包含進去。
      就像相對論沒有推翻牛頓力學，只是證明了牛頓力學是低速下的近似。
      物理學的發展，從來不是推倒重來，而是層層嵌套。
      新理論包容舊理論，舊理論則是新理論在特定條件下的特例。
      從牛頓的超距作用，到法拉第的力線，從馬克士威的電磁波，到彎曲的時空與量子化的場，
      三百年來，我們一點一點地發現：那片看似空無一物的空間，才是宇宙真正的主角。
